services:

  mysql:
    image: mysql:8.0
    container_name: jai-mysql

    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: enterprise_db
      MYSQL_USER: enterprise_user
      MYSQL_PASSWORD: enterprise123

    ports:
      - "3306:3306"

    volumes:
      - mysql-data:/var/lib/mysql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - jai-network


  backend:

    image: jaibardiya5/jai-enterprise-backend:v1

    container_name: jai-backend

    restart: unless-stopped

    depends_on:
      mysql:
        condition: service_healthy

    environment:
      APP_ENV: production
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: enterprise_db
      MYSQL_USER: enterprise_user
      MYSQL_PASSWORD: enterprise123

    ports:
      - "5000:5000"

    networks:
      - jai-network


  frontend:

    image: jaibardiya5/jai-enterprise-frontend:v1

    container_name: jai-frontend

    restart: unless-stopped

    depends_on:
      - backend

    ports:
      - "3000:80"

    networks:
      - jai-network


networks:
  jai-network:


volumes:
  mysql-data:
